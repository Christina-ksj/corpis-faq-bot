<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corpis CMS — 무엇이든 물어보세요</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Serif+Display:ital@0;1&display=swap');

  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --accent: #4A6CF7;
    --accent-dim: rgba(74, 108, 247, 0.15);
    --text: #e8e8e8;
    --text-muted: #888;
    --text-dim: #555;
    --user-bubble: #1a2340;
    --bot-bubble: #1a1a1a;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f0f2f5;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    line-height: 1.7;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* 배경 페이지 힌트 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      linear-gradient(135deg, #e8eaf0 0%, #f5f5f7 100%);
    z-index: 0;
  }

  /* 위젯 래퍼 */
  .widget-wrapper {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 400px;
    height: calc(100vh - 48px);
    max-height: 700px;
    display: flex;
    flex-direction: column;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.1);
    z-index: 10;
    color: var(--text);
  }

  /* 모바일 */
  @media (max-width: 480px) {
    body { background: var(--bg); }
    body::before { display: none; }

    .widget-wrapper {
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 100%;
      max-height: 100%;
      border-radius: 0;
      box-shadow: none;
    }

    header { border-radius: 0; }
    footer { border-radius: 0; padding-bottom: env(safe-area-inset-bottom, 12px); }

    .bubble { max-width: calc(100vw - 80px); }
  }

  /* 헤더 */
  header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    flex-shrink: 0;
    border-radius: 20px 20px 0 0;
  }

  .logo-mark {
    width: 32px;
    height: 32px;
    background: var(--accent);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    color: white;
    letter-spacing: -1px;
  }

  .header-info h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .header-info p {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 300;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    background: #22c55e;
    border-radius: 50%;
    margin-left: auto;
    box-shadow: 0 0 8px #22c55e88;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* 메시지 영역 */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
    background: var(--bg);
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* 메시지 버블 */
  .msg {
    display: flex;
    gap: 8px;
    max-width: 100%;
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    flex-direction: row-reverse;
    align-self: flex-end;
  }

  .msg.bot {
    align-self: flex-start;
  }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    margin-top: 2px;
  }

  .avatar.bot-av {
    background: var(--accent);
    color: white;
    font-family: 'DM Serif Display', serif;
  }

  .avatar.user-av {
    background: var(--surface2);
    color: var(--text-muted);
  }

  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    max-width: 280px;
    font-size: 13.5px;
    line-height: 1.65;
    white-space: pre-wrap;
  }

  .msg.bot .bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
    color: var(--text);
  }

  .msg.user .bubble {
    background: var(--user-bubble);
    border: 1px solid #263560;
    border-top-right-radius: 4px;
    color: #c8d8ff;
  }

  /* 로딩 점 */
  .typing-dots span {
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
    margin: 0 2px;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-6px); }
  }

  /* 추천 질문 칩 */
  .suggestion-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }

  .chip {
    padding: 7px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.18s;
    font-family: 'Noto Sans KR', sans-serif;
  }

  .chip:hover {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--text);
  }

  /* 입력 영역 */
  footer {
    padding: 10px 12px 12px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    border-radius: 0 0 20px 20px;
  }

  .input-wrap {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 14px;
    transition: border-color 0.2s;
  }

  .input-wrap:focus-within {
    border-color: var(--accent);
  }

  #userInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14.5px;
    resize: none;
    max-height: 120px;
    line-height: 1.6;
  }

  #userInput::placeholder { color: var(--text-dim); }

  #sendBtn {
    background: var(--accent);
    border: none;
    border-radius: 10px;
    width: 36px;
    height: 36px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.18s, transform 0.15s;
  }

  #sendBtn:hover { background: #3a5ce0; }
  #sendBtn:active { transform: scale(0.94); }
  #sendBtn:disabled { background: var(--border); cursor: not-allowed; }

  #sendBtn svg { width: 16px; height: 16px; fill: white; }

  .footer-note {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 10px;
  }

</style>
</head>
<body>

<div class="widget-wrapper">
<!-- 헤더 -->
<header>
  <div class="logo-mark">C</div>
  <div class="header-info">
    <h1>Corpis CMS 안내봇</h1>
    <p>기업 웹사이트 운영의 기준을 만드는 엔터프라이즈 CMS</p>
  </div>
  <div class="status-dot"></div>
</header>

<!-- 메시지 영역 -->
<div id="messages"></div>

<!-- 입력 -->
<footer>
  <div class="input-wrap">
    <textarea id="userInput" rows="1" placeholder="Corpis CMS에 대해 무엇이든 물어보세요..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </div>
  <p class="footer-note">Corpis CMS · iropke.com · 본 챗봇은 내부 PoC 테스트용입니다</p>
</footer>
</div><!-- /widget-wrapper -->

<script>
let isLoading = false;

const SYSTEM_PROMPT = `당신은 이롭게(iropke.com)의 Corpis CMS 영업 안내 전문가입니다.
잠재 고객의 질문에 친절하고 전문적으로 답변하며, Corpis CMS의 가치와 차별점을 명확하게 설명합니다.

## Corpis CMS 핵심 정보

### 무엇인가
Corpis CMS는 기업 웹사이트 운영에 특화된 엔터프라이즈 전용 CMS입니다.
iropke.com이 2010년부터 개발·운영해온 자체 솔루션으로, 글로벌 기업의 웹사이트 운영 구조 문제를 해결하기 위해 설계되었습니다.

### 왜 만들었나 — 기존 CMS의 문제
- 커머스 중심 CMS(Shopify 등): 기업 공식 콘텐츠(IR, ESG, 공지)와 근본적으로 맞지 않음
- 범용 CMS(WordPress, Drupal 등): 운영 규모가 커질수록 권한·승인·다국어 관리가 무너짐
- Headless CMS(Sanity, Contentful 등): 기술적 유연성은 좋으나 운영 모델과 승인 구조가 없음. 개발자 의존도 높음

### 설계 철학
기업 웹사이트 운영을 복잡하게 만드는 문제를 기능 추가가 아닌 **운영 구조의 설계**로 해결합니다.

### 핵심 기능 5가지
1. **다국어·다국가·멀티사이트 운영** — 국가·법인 단위로 콘텐츠를 구조적으로 분리. 글로벌 기준과 로컬 자율성 동시 유지
2. **역할 기반 권한 관리(RBAC)** — Super Admin / Regional Admin / Editor 3단계 구조. 조직·부서·국가별 권한 분리
3. **승인·이력·감사 체계** — 콘텐츠 등록→승인→공개 일관된 흐름. 변경 이력 자동 저장. 법적 증거 활용 가능
4. **SEO/AEO 구조화 데이터** — JSON-LD 자동 생성. FAQ·제품·콘텐츠를 AI가 인용할 수 있는 구조로 설계
5. **기업 공식 콘텐츠 관리** — IR·ESG·약관·뉴스룸·FAQ·채용을 구조화된 콘텐츠 유형으로 통합 관리

### 제공하는 가치
- **운영 효율성**: 반복 작업, 승인 지연, 불필요한 커뮤니케이션 감소
- **관리 기준 표준화**: 담당자나 부서에 따라 달라지는 운영 방식 통일
- **글로벌 운영 안정성**: 다국가·다언어 확장 이후에도 일관성 유지
- **AI·AEO 환경 대응**: AI 검색에서 기업 정보가 정확하게 인식되도록 지원

### 적합한 조직
- 중견·대기업, 상장사
- 글로벌·다국어 웹사이트를 운영하는 조직
- IR·ESG·공식 커뮤니케이션이 중요한 기업
- 여러 부서·국가가 하나의 웹사이트를 함께 운영하는 환경

### 경쟁사 대비 Corpis 강점 (vs AEM, Contentful, Drupal, Sanity)
- IR/ESG/정책 관리: 기본 내장 (경쟁사는 커스텀 개발 필요)
- FAQ 구조화 + AEO 대응: 기본 내장
- 문의·검색·추천 통합 관리: 기본 내장
- 채용·조직 구조 관리: 기본 내장
- 권한 분리 + Audit + 운영 중심 구조: 기본 내장

### DN솔루션즈 적용 사례
글로벌 공작기계 기업 DN솔루션즈의 글로벌 웹사이트 전면 개편 프로젝트에 Corpis CMS 적용.
7개 국가 사이트, Korea·Germany·USA·China 리전별 독립 운영, 400+ 제품 데이터 구조화,
하이브리드 헤드리스 아키텍처(AWS 기반) 구현.

### 기술 스택 (참고용)
Java 17, Spring Boot 3.4.5, React 19, PostgreSQL 17, AWS(CloudFront·WAF·Route53·EC2), JWT+2FA 인증

## 답변 스타일
- 한국어로 답변
- 간결하고 명확하게, 전문 용어는 쉽게 풀어서
- 고객의 상황에 공감하며 Corpis가 어떻게 도움이 되는지 구체적으로 연결
- 모르는 정보는 "확인이 필요합니다"라고 명시. 절대 지어내지 않음
- 영업 톤이되 강요하지 않음. 고객이 스스로 판단할 수 있도록 정보 제공
- 답변 마지막에 자연스럽게 후속 질문을 유도`;

const SUGGESTIONS = [
  "Corpis CMS가 WordPress와 다른 점이 뭔가요?",
  "글로벌 다국어 사이트에 적합한가요?",
  "IR·ESG 콘텐츠 관리가 어떻게 되나요?",
  "권한 관리 구조가 어떻게 되나요?",
  "도입 비용이나 라이선스는 어떻게 되나요?",
  "AEO·AI 검색 대응이 뭔가요?"
];

let conversationHistory = [];

window.addEventListener('DOMContentLoaded', () => {
  addWelcomeMessage();
});

function addWelcomeMessage() {
  const welcome = `안녕하세요! 저는 **Corpis CMS** 안내 전문가입니다. 😊

기업 웹사이트 운영, 다국어·다국가 관리, 권한 체계, AEO 대응 등 Corpis에 대해 궁금한 것이 있으시면 무엇이든 물어보세요.

아래 추천 질문을 클릭하거나, 직접 입력하셔도 됩니다.`;

  appendMessage('bot', welcome, true);
}

function appendMessage(role, text, showSuggestions = false) {
  const msgs = document.getElementById('messages');
  const wrapper = document.createElement('div');
  wrapper.className = `msg ${role}`;

  const avatar = document.createElement('div');
  avatar.className = `avatar ${role === 'bot' ? 'bot-av' : 'user-av'}`;
  avatar.textContent = role === 'bot' ? 'C' : '나';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatText(text);

  if (showSuggestions) {
    const row = document.createElement('div');
    row.className = 'suggestion-row';
    SUGGESTIONS.forEach(s => {
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.textContent = s;
      chip.onclick = () => {
        document.getElementById('userInput').value = s;
        sendMessage();
      };
      row.appendChild(chip);
    });
    bubble.appendChild(row);
  }

  wrapper.appendChild(avatar);
  wrapper.appendChild(bubble);
  msgs.appendChild(wrapper);
  msgs.scrollTop = msgs.scrollHeight;
  return bubble;
}

function formatText(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const wrapper = document.createElement('div');
  wrapper.className = 'msg bot';
  wrapper.id = 'typingIndicator';

  const avatar = document.createElement('div');
  avatar.className = 'avatar bot-av';
  avatar.textContent = 'C';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

  wrapper.appendChild(avatar);
  wrapper.appendChild(bubble);
  msgs.appendChild(wrapper);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  autoResize(input);
  appendMessage('user', text);

  conversationHistory.push({ role: 'user', content: text });
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;
  showTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system: SYSTEM_PROMPT,
        messages: conversationHistory
      })
    });

    const data = await res.json();
    removeTyping();

    if (data.error) {
      appendMessage('bot', `오류가 발생했습니다: ${data.error.message}`);
    } else {
      const reply = data.content[0].text;
      conversationHistory.push({ role: 'assistant', content: reply });
      appendMessage('bot', reply);
    }
  } catch (e) {
    removeTyping();
    appendMessage('bot', '네트워크 오류가 발생했습니다. API 키와 인터넷 연결을 확인해주세요.');
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
</script>
</body>
</html>
